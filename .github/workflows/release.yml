name: Release
# Builds the downloads (Inkacre with its own Node runtime) on each system and opens each one to check it works. On a
# version tag (v0.1.0 …) they go on that tag's GitHub release: one made by hand on GitHub, or else made here. Run by
# hand (Actions › Release › Run workflow) to only build and check; the packages are then the run's artifacts.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

# A release made on GitHub with a new tag can start this twice (the tag and the release); the second run waits.
concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, system: macos }
          - { os: windows-latest, system: windows }
          - { os: ubuntu-latest, system: linux }
    runs-on: ${{ matrix.os }}
    # macOS signing and notarization, when the repository has these secrets (Settings › Secrets and variables ›
    # Actions): the Developer ID Application certificate as base64 of its .p12 and the password it was exported with;
    # an App Store Connect API key (the .p8 file's text, its key ID and the issuer ID). Without them: unsigned.
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Disk image tool (macOS)
        if: matrix.system == 'macos'
        run: brew install create-dmg
      - name: Signing identity (macOS, when the signing secrets are set)
        if: matrix.system == 'macos' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"; password=$(openssl rand -hex 16)
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$identity" ]; then echo "::error title=Signing::MACOS_CERTIFICATE_P12 holds no Developer ID Application certificate."; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          else
            echo "::warning title=Notarization::The App Store Connect API key secrets are not all set: signed but not notarized."
          fi
      - name: Build the package
        run: node scripts/package.mjs --out dist
      - name: Open it and check it works
        run: node scripts/package-smoke.mjs dist
      - name: The disk image holds the app and Applications, and the app from it works (macOS)
        if: matrix.system == 'macos'
        run: |
          image=$(ls dist/*.dmg)
          volume=$(hdiutil attach -nobrowse -readonly "$image" | awk -F'\t' 'END { print $NF }' | sed 's/[[:space:]]*$//')
          ls -la "$volume"
          test -d "$volume/Inkacre.app" && test -L "$volume/Applications"
          if [ -d "$volume/.background" ] && [ -f "$volume/.DS_Store" ]; then echo "::notice title=Disk image::The window layout is in the image."; fi
          mkdir -p "$RUNNER_TEMP/from-image" && ditto "$volume/Inkacre.app" "$RUNNER_TEMP/from-image/Inkacre.app"
          hdiutil detach "$volume"
          node scripts/package-smoke.mjs "$RUNNER_TEMP/from-image"
      - uses: actions/upload-artifact@v4
        with:
          name: inkacre-${{ matrix.system }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made by hand on GitHub (with this tag) gets the files; otherwise the release is made here.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Inkacre ${GITHUB_REF_NAME#v}" --generate-notes
          fi
